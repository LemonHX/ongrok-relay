[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
# No fixed upgrade exists for postcard's heapless/atomic-polyfill chain or
# rustls-pemfile; cargo audit still reports these for dependency replacement.
ignore = ["RUSTSEC-2023-0089", "RUSTSEC-2025-0134"]
unmaintained = "transitive"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
