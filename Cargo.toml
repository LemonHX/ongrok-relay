[workspace]
members = [
    "crates/libongrok",
    "crates/ongrok-relay-server",
    "crates/ongrok-relay-client",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 256
lto = false
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
debug-assertions = false
