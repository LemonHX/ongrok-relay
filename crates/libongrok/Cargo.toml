[package]
name = "libongrok"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
blake3 = "1.8.7"
bytes = { version = "1.12.1", features = ["serde"] }
futures = "0.3.34"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
quinn = "0.11.11"
rand = "0.10.2"
rustls = { version = "0.23.43", default-features = false, features = ["std", "tls12", "ring"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v7", "serde"] }
webpki-roots = "1.0.9"
yamux = "0.14.0"
